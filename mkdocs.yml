site_name: Teaching Practice Lab
site_description: Public instructional learning platform for understanding, practicing, and defending instructional frameworks.
repo_url: https://github.com/Gh0stlyKn1ght/Marzano-Learning-Map
repo_name: Gh0stlyKn1ght/Marzano-Learning-Map
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Documentation Map: SUMMARY.md
  - Course Research:
      - Full Course Blueprint: course/course-blueprint.md
      - Learning Design: course/learning-design.md
      - FTEM Framework Map: course/framework-map.md
      - Research Backlog: course/research-backlog.md
      - Standards-Based Planning:
