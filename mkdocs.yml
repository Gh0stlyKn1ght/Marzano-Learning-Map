site_name: Teaching Practice Lab
site_description: Public instructional learning platform for understanding, practicing, and defending instructional frameworks.
repo_url: https://github.com/Gh0stlyKn1ght/Marzano-Learning-Map
repo_name: Gh0stlyKn1ght/Marzano-Learning-Map
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Documentation Map: SUMMARY.md
  - Course Research:
      - Full Course Blueprint: course/course-blueprint.md
      - Learning Design: course/learning-design.md
      - FTEM Framework Map: course/framework-map.md
      - Research Backlog: course/research-backlog.md
      - Standards-Based Instruction Dossiers:
          - Overview: course/dossiers/standards-based-instruction/index.md
          - Distinction Matrix: course/dossiers/standards-based-instruction/distinction-matrix.md
          - Identifying Critical Content: course/dossiers/standards-based-instruction/identifying-critical-content.md
          - Previewing New Content: course/dossiers/standards-based-instruction/previewing-new-content.md
          - Processing New Content: course/dossiers/standards-based-instruction/processing-new-content.md
          - Questions to Elaborate: course/dossiers/standards-based-instruction/elaborating-with-questions.md
          - Reviewing Content: course/dossiers/standards-based-instruction/reviewing-content.md
          - Practice Skills/Strategies/Processes: course/dossiers/standards-based-instruction/practice-skills-strategies-processes.md
          - Similarities and Differences: course/dossiers/standards-based-instruction/similarities-and-differences.md
          - Examine Reasoning: course/dossiers/standards-based-instruction/examine-reasoning.md
          - Revise Knowledge: course/dossiers/standards-based-instruction/revise-knowledge.md
          - Cognitively Complex Tasks: course/dossiers/standards-based-instruction/cognitively-complex-tasks.md
  - Project:
      - Doctrine: project/doctrine.md
      - Roadmap: project/roadmap.md
      - Terminology: project/terminology.md
  - Course:
      - Vision: product/index.md
      - Exercise System: product/course-exercises.md
      - UI Design: product/ui-design.md
      - Foundations: paths/foundations/index.md
  - Frameworks:
      - Overview: frameworks/index.md
      - FTEM: frameworks/ftem/index.md
      - Legacy 2011: frameworks/legacy-2011/index.md
  - Sources:
      - Source Policy: sources/index.md
      - Registry: sources/registry.md
  - Architecture:
      - Overview: architecture/index.md
      - Libraries: architecture/libraries.md
      - Public Platform: architecture/public-platform.md
  - Implementation:
      - Overview: implementation/README.md
      - Local CI: implementation/local-ci.md
      - Validation: implementation/testing.md
