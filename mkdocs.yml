site_name: Teaching Practice Lab
site_description: Game-based instructional mastery platform for learning, practicing, defending, and transferring teaching frameworks.
repo_url: https://github.com/Gh0stlyKn1ght/Marzano-Learning-Map
repo_name: Gh0stlyKn1ght/Marzano-Learning-Map
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Documentation Map: SUMMARY.md
  - Project:
      - Doctrine: project/doctrine.md
      - Roadmap: project/roadmap.md
      - Terminology: project/terminology.md
  - Product:
      - Vision: product/index.md
      - Mastery System: product/mastery-system.md
      - Challenge System: product/challenge-system.md
      - UI Design: product/ui-design.md
      - Build Roadmap: product/build-roadmap.md
  - Frameworks:
      - Overview: frameworks/index.md
      - FTEM: frameworks/ftem/index.md
      - Legacy 2011: frameworks/legacy-2011/index.md
  - Architecture:
      - Overview: architecture/index.md
      - Libraries: architecture/libraries.md
      - Game Platform: architecture/game-platform.md
      - Data Model: architecture/data-model.md
  - Sources:
      - Source Policy: sources/index.md
      - Registry: sources/registry.md
